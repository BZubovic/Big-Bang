<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Pregled — Big Bang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/colors_and_type.css">
<script src="image-slot.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bb-bg-page);
    font-family: var(--bb-font-family);
    color: var(--bb-text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; }

  /* ===== HEADER ===== */
  .bb-header {
    background: var(--bb-blue-primary);
  }
  .bb-header-top {
    max-width: 1440px;
    margin: 0 auto;
    height: 92px;
    padding: 0 40px;
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    align-items: center;
    gap: 40px;
  }
  .bb-logo { height: 38px; display: block; filter: brightness(0) invert(1); }
  .bb-search {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .bb-search input {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 28px;
    padding: 0 64px 0 28px;
    font-family: inherit;
    font-size: 16px;
    color: var(--bb-text-primary);
    background: #fff;
    outline: none;
    letter-spacing: -0.01em;
  }
  .bb-search input::placeholder { color: #B6B6B6; }
  .bb-search .search-icon {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    color: #0050A0;
    pointer-events: none;
  }
  .bb-header-icons {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 28px;
  }
  .bb-icon-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .bb-icon-btn svg { display: block; }
  .bb-cart-badge {
    position: absolute;
    top: -2px;
    right: -6px;
    background: var(--bb-turquoise);
    color: var(--bb-blue-primary);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* ===== NAV ===== */
  .bb-nav {
    background: #002D73;
  }
  .bb-nav-inner {
    max-width: 1440px;
    margin: 0 auto;
    height: 52px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bb-nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bb-nav-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    padding: 8px 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .bb-nav-btn:hover { background: rgba(255,255,255,0.08); }
  .bb-nav-btn svg { display: block; opacity: 0.95; }
  .bb-nav-inner > .bb-nav-btn:first-child { margin-left: -14px; }
  .bb-nav-right > .bb-nav-btn:last-child { margin-right: -14px; }

  /* ===== MAIN ===== */
  .bb-main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 60px 80px;
  }
  .bb-panel {
    background: transparent;
    box-shadow: none;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    overflow: visible;
    align-items: start;
  }

  /* ===== SIDEBAR ===== */
  .bb-sidebar {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(16,17,23,0.06);
    padding: 26px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    height: fit-content;
  }
  .bb-user {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    padding: 0 8px 18px;
    border-bottom: 1px solid #ECEEF3;
  }
  .bb-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #E7EFFA;
    color: var(--bb-blue-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bb-user-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--bb-text-primary);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .bb-user-addr {
    margin-top: 4px;
    font-size: 13px;
    color: #8A8F9A;
    line-height: 1.35;
    letter-spacing: -0.005em;
  }

  .bb-menu-section {
    margin-top: 18px;
    padding: 0 6px 6px;
    font-size: 16px;
    font-weight: 700;
    color: var(--bb-text-primary);
    letter-spacing: -0.01em;
  }
  .bb-menu-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: var(--bb-text-primary);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: background 0.15s, color 0.15s;
  }
  .bb-menu-item .bb-menu-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    color: #2F343F;
    flex-shrink: 0;
  }
  .bb-menu-item .bb-menu-chev {
    margin-left: auto;
    color: #2F343F;
    display: flex;
    align-items: center;
  }
  .bb-menu-item:hover {
    background: #F4F6FA;
  }
  .bb-menu-item.active {
    background: #E8F0F9;
    color: var(--bb-blue-primary);
    font-weight: 700;
  }
  .bb-menu-item.active .bb-menu-icon,
  .bb-menu-item.active .bb-menu-chev {
    color: var(--bb-blue-primary);
  }
  .bb-menu-item.logout {
    margin-top: 18px;
    padding-top: 26px;
    border-top: 1px solid #E4E6EC;
    border-radius: 0 0 10px 10px;
  }
  .bb-menu-item.logout:hover { background: #F4F6FA; }

  /* ===== CONTENT ===== */
  .bb-content {
    padding: 0;
    min-width: 0;
  }
  .bb-content h1 {
    margin: 0 0 28px;
    font-size: 28px;
    font-weight: 700;
    color: var(--bb-text-primary);
    letter-spacing: -0.015em;
  }
  .bb-orders {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .bb-order {
    border: 1px solid #E4E6EC;
    border-radius: 12px;
    padding: 22px 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 32px;
    background: #fff;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .bb-order:hover {
    border-color: #C7CEDB;
    box-shadow: 0 4px 14px rgba(16,17,23,0.06);
  }
  .bb-order-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--bb-text-primary);
    letter-spacing: -0.01em;
    margin: 0;
  }
  .bb-order-id {
    margin-top: 4px;
    font-size: 13px;
    color: #8A8F9A;
    letter-spacing: -0.005em;
  }
  .bb-status {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 4px;
    background: var(--bb-blue-primary);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.005em;
  }
  .bb-thumbs {
    display: flex;
    gap: 10px;
  }
  .bb-thumb {
    width: 88px;
    height: 88px;
    border-radius: 8px;
    background: #F1F1F4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bb-thumb-more {
    font-size: 18px;
    font-weight: 600;
    color: #3D4043;
    letter-spacing: -0.01em;
  }
  .bb-thumb svg { display: block; }
  .bb-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 8px; }
  .bb-dev-img { width: 100%; height: 180px; object-fit: contain; border-radius: 10px; background: #fff; display: block; }
  /* Klub overview card */
  .bb-klub-lvl { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-top: 18px; }
  .bb-klub-lvl-name { font-size: 16px; color: var(--bb-text-primary); letter-spacing: -0.01em; }
  .bb-klub-lvl-name strong { font-weight: 700; }
  .bb-klub-lvl-pts { font-size: 14px; color: #8A8F9A; letter-spacing: -0.01em; white-space: nowrap; }
  .bb-klub-bar { height: 10px; border-radius: 999px; background: #EEF0F4; overflow: hidden; margin-top: 12px; }
  .bb-klub-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--bb-turquoise) 0%, var(--bb-blue-navy) 100%); }
  .bb-klub-next { font-size: 13.5px; color: #8A8F9A; margin-top: 12px; letter-spacing: -0.005em; }
  .bb-klub-next b { color: var(--bb-blue-primary); font-weight: 600; }

  /* ===== Order: details button ===== */
  .bb-order {
    grid-template-columns: 1fr auto auto;
  }
  .bb-order-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bb-blue-primary);
    color: #fff;
    border: none;
    border-radius: 22px;
    height: 42px;
    padding: 0 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bb-order-cta:hover { background: var(--bb-blue-dark); }
  .bb-order-cta svg { display: block; }

  /* ===== Pagination ===== */
  .bb-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 36px;
    flex-wrap: wrap;
  }
  .bb-page {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fff;
    border: none;
    color: #101117;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(16,17,23,0.06);
    transition: background 0.15s, color 0.15s;
  }
  .bb-page:hover { background: #F4F6FA; }
  .bb-page.active {
    background: var(--bb-blue-dark);
    color: #fff;
  }
  .bb-page.active:hover { background: var(--bb-blue-dark); }
  .bb-page.nav { color: #15171c; }
  .bb-page.nav svg { display: block; }
  .bb-page.dots {
    cursor: default;
    color: #2F343F;
    letter-spacing: 0.08em;
  }
  .bb-page.dots:hover { background: #fff; }

  /* ===== Back arrow header ===== */
  .bb-content-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .bb-back {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--bb-text-primary);
    transition: background 0.15s;
  }
  .bb-back:hover { background: #F1F1F4; }
  .bb-content-header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: var(--bb-text-primary);
    letter-spacing: -0.015em;
  }

  /* ===== Zgodovina točk summary ===== */
  .bb-pts-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 26px; }
  .bb-pts-card { background: #fff; border-radius: 14px; padding: 20px 24px; }
  .bb-pts-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A8F9A; margin-bottom: 10px; }
  .bb-pts-value { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  /* ===== Detail view ===== */
  .bb-detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    margin-bottom: 22px;
  }
  .bb-meta-card {
    background: #F7F8FA;
    border: 1px solid #ECEEF3;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .bb-meta-label {
    font-size: 12px;
    font-weight: 600;
    color: #8A8F9A;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .bb-meta-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--bb-text-primary);
    letter-spacing: -0.005em;
  }
  .bb-meta-value .bb-status {
    margin-top: 0;
    padding: 4px 10px;
    font-size: 12px;
  }
  .bb-section-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 22px 0 12px;
  }
  .bb-items {
    border: 1px solid #E4E6EC;
    border-radius: 12px;
    overflow: hidden;
  }
  .bb-item {
    display: grid;
    grid-template-columns: 96px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 16px 18px;
    border-bottom: 1px solid #ECEEF3;
  }
  .bb-item:last-child { border-bottom: none; }
  .bb-item-thumb {
    width: 96px;
    height: 96px;
    border-radius: 8px;
    background: #F1F1F4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bb-item-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--bb-text-primary);
    letter-spacing: -0.005em;
    line-height: 1.35;
  }
  .bb-item-qty {
    margin-top: 6px;
    font-size: 13px;
    color: #8A8F9A;
  }
  .bb-item-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--bb-text-primary);
    letter-spacing: -0.01em;
    text-align: right;
    white-space: nowrap;
  }

  .bb-summary {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .bb-summary-card {
    border: 1px solid #E4E6EC;
    border-radius: 12px;
    padding: 18px 20px;
  }
  .bb-summary-card h3 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .bb-summary-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    color: #3D4043;
  }
  .bb-summary-row.total {
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px solid #ECEEF3;
    font-size: 16px;
    font-weight: 700;
    color: var(--bb-text-primary);
  }
  .bb-addr-line {
    font-size: 14px;
    line-height: 1.5;
    color: #3D4043;
  }
  .bb-addr-line strong { color: var(--bb-text-primary); }

  /* ===== KLUBSKA KARTICA ===== */
  .bb-klub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  /* Member card (visual) */
  .bb-card-visual {
    position: relative;
    aspect-ratio: 1.586 / 1;
    border-radius: 16px;
    background: url("assets/bg-uau.png") center / cover no-repeat, #0050A0;
    color: #fff;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px -10px rgba(0, 45, 115, 0.55), inset 0 0 0 1px rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .bb-card-visual::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -10%;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 223, 186, 0.35) 0%, transparent 65%);
    pointer-events: none;
  }
  .bb-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .bb-card-brand {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    opacity: 0.85;
  }
  .bb-card-tier {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 4px;
    background: #fff;
    color: #0A2E5C;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .bb-card-tier svg { color: #0A2E5C; }
  .bb-card-uau {
    position: relative;
    z-index: 1;
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 4px 0;
  }
  .bb-card-uau small {
    display: inline;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    opacity: 0.92;
    margin-left: 4px;
    text-transform: none;
  }
  .bb-card-since {
    position: relative;
    z-index: 1;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    opacity: 0.85;
    white-space: nowrap;
  }
  .bb-card-bottom {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .bb-card-num {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  .bb-card-num-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 5px;
  }
  .bb-card-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    margin-top: 10px;
  }
  .bb-card-chip {
    width: 38px;
    height: 28px;
    border-radius: 4px;
    background: linear-gradient(135deg, #E8C56B 0%, #C99A2D 60%, #8C6B12 100%);
    position: relative;
    flex-shrink: 0;
  }
  .bb-card-chip::before,
  .bb-card-chip::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 4px;
  }
  .bb-card-chip::after {
    inset: 4px;
    border-radius: 2px;
    border-color: rgba(0,0,0,0.18);
  }

  /* Points + Tier card */
  .bb-points-card {
    border-radius: 16px;
    border: 1px solid #E4E6EC;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  .bb-points-value {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--bb-blue-primary);
  }
  .bb-points-label {
    font-size: 14px;
    font-weight: 500;
    color: #6D6D6D;
    margin-top: 8px;
    letter-spacing: -0.005em;
  }
  .bb-tier-row {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #3D4043;
  }
  .bb-tier-row strong { color: var(--bb-text-primary); font-weight: 700; }
  .bb-tier-bar {
    margin-top: 10px;
    height: 8px;
    background: #ECEEF3;
    border-radius: 99px;
    overflow: hidden;
  }
  .bb-tier-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #10DFBA 0%, #0050A0 100%);
    border-radius: 99px;
  }
  .bb-tier-hint {
    margin-top: 10px;
    font-size: 13px;
    color: #6D6D6D;
  }
  .bb-tier-hint strong { color: var(--bb-blue-primary); }

  /* Member info row */
  .bb-info-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .bb-info-card {
    border: 1px solid #E4E6EC;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .bb-info-label {
    font-size: 11px;
    font-weight: 600;
    color: #8A8F9A;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bb-info-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--bb-text-primary);
    letter-spacing: -0.005em;
    line-height: 1.4;
    word-break: break-word;
  }

  /* Offer cards */
  .bb-offer-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .bb-offer {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E4E6EC;
    background: #fff;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
  }
  .bb-offer:hover {
    box-shadow: 0 6px 18px rgba(16,17,23,0.08);
    transform: translateY(-2px);
  }
  .bb-offer.locked:hover { transform: none; box-shadow: none; }
  .bb-offer-thumb {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.02em;
    position: relative;
  }
  .bb-offer-thumb small {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0.9;
    text-transform: uppercase;
    margin-top: 4px;
    text-align: center;
  }
  .bb-offer-tier-pill {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 62px;
    padding: 6px;
    text-align: center;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: none;
