  <div style="background:#0050A0">
    <div style="max-width:1480px;margin:0 auto;height:72px;display:flex;align-items:center;position:relative;padding:0 20px 0 40px">

      <div style="position:absolute;left:50%;transform:translateX(-50%);width:600px;max-width:calc(100% - 520px);z-index:345">
        <div style="display:flex;align-items:center;background:#fff;border-radius:22px;height:44px;overflow:hidden">
          <input value="{{ q }}" onChange="{{ onQ }}" onKeyDown="{{ onKeyQ }}" onFocus="{{ onFocusQ }}" placeholder="Koji proizvod tražiš? Unesi pojam za pretragu..." style="flex:1;min-width:0;height:100%;border:none;outline:none;padding:0 16px;font-family:Inter,sans-serif;font-size:14px;color:#101117;background:transparent;letter-spacing:-0.02em">
          <sc-if value="{{ showClear }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ clearQ }}" style="width:30px;height:100%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:#545F71;flex-shrink:0" style-hover="color:#101117">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
            </button>
          </sc-if>
          <button onClick="{{ submitQ }}" style="width:48px;height:100%;background:#10DFBA;border:none;display:flex;align-items:center;justify-content:center;color:#002D73;flex-shrink:0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
        <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
                    <dc-import name="Components/SearchPanel" term="{{ q }}" mobile="{{ false }}" suggestions="{{ sugg }}" items="{{ sitems }}" on-all="{{ submitQ }}" hint-size="100%,400px" style="position:absolute;left:0;right:0;top:52px;z-index:350"></dc-import>
                  </sc-if>
                  <sc-if value="{{ searchPopular }}" hint-placeholder-val="{{ false }}">
                    <dc-import name="Components/SearchPanel" term="" mode="popular" popular="{{ popularTerms }}" mobile="{{ false }}" on-all="{{ submitQ }}" hint-size="100%,400px" style="position:absolute;left:0;right:0;top:52px;z-index:350"></dc-import>
                  </sc-if>
      </div>
      <div style="display:flex;gap:4px;align-items:center;margin-left:auto;position:relative;z-index:1">
        <button onClick="{{ onWish }}" style="background:none;border:none;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px;color:#fff;font-family:Inter,sans-serif;cursor:pointer">
          <span style="color:#fff;display:flex"><svg width="22" height="22" viewBox="0 0 30 30" fill="none"><path d="M3.75736 5.96572C1.41421 8.25335 1.41421 11.9623 3.75736 14.25L12.8516 23.1287C13.4903 23.7523 14.5099 23.7523 15.1485 23.1287L24.2426 14.25C26.5858 11.9623 26.5858 8.25335 24.2426 5.96572C21.8995 3.67809 18.1005 3.67809 15.7574 5.96572L14.0001 7.68151L12.2426 5.96572C9.8995 3.67809 6.1005 3.67809 3.75736 5.96572Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>

        </button>
        <button style="background:none;border:none;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px;color:#fff;font-family:Inter,sans-serif" onClick="{{ onAccount }}">
          <span style="color:#fff;display:flex"><svg width="22" height="22" viewBox="0 0 30 30" fill="none"><path d="M15 18.25C18.866 18.25 22 15.116 22 11.25C22 7.38401 18.866 4.25 15 4.25C11.134 4.25 8 7.38401 8 11.25C8 15.116 11.134 18.25 15 18.25Z" stroke="currentColor" stroke-width="2"></path><path d="M4 24.25C5.064 22.4258 6.59451 20.9109 8.43766 19.8577C10.2808 18.8045 12.3717 18.25 14.5 18.25C16.6283 18.25 18.7192 18.8045 20.5623 19.8577C22.4055 20.9109 23.936 22.4258 25 24.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>

        </button>
        <button onClick="{{ onCart }}" style="background:none;border:none;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px;color:#fff;font-family:Inter,sans-serif;position:relative">
          <span style="position:relative;color:#fff;display:flex">

            <sc-if value="{{ hasCart }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:-6px;right:-8px;background:#10DFBA;color:#002D73;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ cartCount }}</span></sc-if>
          </span>
          <span style="font-size:10px;font-weight:500;opacity:0.85">Košarica</span>
        </button>
      </div>
    </div>
  </div>

  <div style="background:#002D73;position:relative">

        <span style="display:flex;opacity:0.95">
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

  &quot;onLogo&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e: any) =&gt; void&quot; },
  &quot;onAccount&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e: any) =&gt; void&quot; },
  &quot;loggedIn&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;menuOpen&quot;: {
    &quot;editor&quot;: &quot;boolean&quot;,
    &quot;default&quot;: false,
    &quot;tsType&quot;: &quot;boolean&quot;
  },
  &quot;scrolled&quot;: {
    &quot;editor&quot;: &quot;boolean&quot;,
    &quot;default&quot;: false,
    &quot;tsType&quot;: &quot;boolean&quot;
  },
  &quot;onCart&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot; },
  &quot;onWish&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot; },
  &quot;cartCount&quot;: {
    &quot;editor&quot;: &quot;int&quot;,
    &quot;default&quot;: 2,
    &quot;tsType&quot;: &quot;number&quot;
  },
  &quot;onSearch&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(term: string) =&gt; void&quot; },
  &quot;onOpenProduct&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(p: any) =&gt; void&quot; },
  &quot;onToggleMenu&quot;: {
    &quot;editor&quot;: null,
    &quot;tsType&quot;: &quot;() => void&quot;
  }
}">
const TERMS = [
  'laptop', 'laptop gaming', 'laptop hp', 'laptop torba', 'mobitel', 'mobitel samsung',
  'televizor', 'televizor 55', 'klima uređaj', 'perilica posuđa', 'perilica rublja',
  'slušalice', 'pametni sat', 'usisavač', 'hladnjak', 'tablet', 'monitor', 'konzola', 'kava aparat'
];

const POPULAR = [
  'pametni telefon', 'televizor 55"', 'laptop za posao', 'perilica rublja',
  'klima uređaj', 'slušalice bežične', 'pametni sat', 'usisavač robot'
];

const SPROD = [
  { img: 'images/prod-laptop-hp-victus.webp', brand: 'HP', name: 'Laptop Victus Gaming 15-fa2721nc | i5-13420H | RTX 4050 (6GB) / i5 / RAM 16 GB / SSD Drive / 15,6" FHD', price: '1231,38 €' },
  { img: 'images/prod-laptop-hp-omnibook7.webp', brand: 'HP', name: 'Laptop HP Zbook Fury 18 G1i | U9 285HX | 64GB RAM | 2TB SSD | NVIDIA RTX PRO 5000 / Core Ultra 9 / RAM 64 GB / 18" WQHD', price: '13.219,85 €' },
  { img: 'images/prod-laptop-hp-omnibook5-16.webp', brand: 'HP', name: 'Laptop HP ProBook 465 G11 | R5-7535U | 16GB RAM | W11H | AMD Ryzen 5 / RAM 16 GB / SSD Drive / 16,0" WUXGA', price: '873,99 €', old: '1005,49 €' },
  { img: 'images/prod-laptop-acer-aspire-lite1.webp', brand: 'ACER', name: 'Laptop Acer Nitro V15 NH.QPGEX.00B, 15/R5/16/512/RTX2050/W11', price: '689,99 €' },
  { img: 'images/prod-samsung-a16.webp', brand: 'SAMSUNG', name: 'Mobitel SAMSUNG Galaxy A16 5G, 128 GB, Blue Black', price: '199,00 €', old: '249,00 €' },
  { img: 'images/prod-huawei-watch.webp', brand: 'HUAWEI', name: 'Pametni sat HUAWEI Watch GT 5 Pro 46 mm, Black', price: '379,00 €' },
  { img: 'images/prod-hisense-klima.webp', brand: 'HISENSE', name: 'Klima uređaj HISENSE Energy Ultra 3,5 kW, WiFi, komplet s montažom', price: '699,00 €', old: '899,00 €' },
  { img: 'images/prod-bosch-perilica.webp', brand: 'BOSCH', name: 'Perilica rublja BOSCH WGG14403BY, 9 kg, 1400 o/min, A', price: '549,00 €' }
];

class Component extends DCLogic {
  state = { q: '', open: false, focused: false, mobTop: 116 };

  rootRef = (el) => { this.root = el || this.root; };
  mobSearchRef = (el) => { if (el) { this.mobSearch = el; this.measureMob(); } };

  /* the mobile panel and backdrop start at the top of the navy nav strip, so the
     strip is covered while the blue search bar above it stays bright */
  measureMob = () => {
    const el = this.mobSearch;
    if (!el || !el.isConnected) return;
    const header = el.closest('[data-bb-header="mobile"]');
    const nav = header && header.querySelector('.nsb');
    const edge = nav || el;
    const frame = el.closest('[data-bb-frame]');
    const base = frame ? frame.getBoundingClientRect().top : 0;
    const r = edge.getBoundingClientRect();
    const top = Math.round((nav ? r.top : r.bottom) - base);
    if (top !== this.state.mobTop) this.setState({ mobTop: top });
  };

  componentDidMount() {
    /* a click anywhere outside the search field and its panel dismisses both */
    this.onDocDown = (e) => {
      if (!this.state.focused && !this.state.open) return;
      const t = e.target;
      if (this.root && this.root.contains(t)) return;
      const panel = document.querySelector('[data-bb-searchpanel]');
      if (panel && panel.contains(t)) return;
      this.setState({ open: false, focused: false });
    };
    document.addEventListener('mousedown', this.onDocDown, true);
    this.onAnyScroll = () => this.measureMob();
    document.addEventListener('scroll', this.onAnyScroll, true);
    window.addEventListener('resize', this.onAnyScroll);
  }
  componentWillUnmount() {
    document.removeEventListener('mousedown', this.onDocDown, true);
    document.removeEventListener('scroll', this.onAnyScroll, true);
    window.removeEventListener('resize', this.onAnyScroll);
  }

  onQ = (e) => {
    const v = e.target.value;
    this.setState({ q: v, open: v.trim().length > 0, focused: true });
  };
  clearQ = (e) => { if (e) e.preventDefault(); this.setState({ q: '', open: false, focused: false }); };
  closeQ = (e) => { if (e) e.preventDefault(); this.setState({ open: false, focused: false }); };
  onFocusQ = () => { this.measureMob(); this.setState({ focused: true, open: this.state.q.trim().length > 0 }); };
  submitQ = (e) => {
    if (e) e.preventDefault();
    const t = this.state.q.trim();
    if (!t) return;
    this.setState({ open: false, focused: false });
    (this.props.onSearch || (() => {}))(t);
  };
  pickTerm = (t) => (e) => {
    if (e) e.preventDefault();
    this.setState({ q: t, open: false, focused: false });
    (this.props.onSearch || (() => {}))(t);
  };
  openProd = (p) => (e) => {
    if (e) e.preventDefault();
    this.setState({ open: false, focused: false });
    (this.props.onOpenProduct || (() => {}))({ img: p.img, name: p.name, price: p.price, old: p.old || '' });
  };

  renderVals() {
    const variant = this.props.variant || 'desktop';
    const open = !!this.props.menuOpen;
    const toggle = this.props.onToggleMenu || (() => {});
    const q = this.state.q;
    const ql = q.trim().toLowerCase();
    let terms = TERMS.filter(t => t.indexOf(ql) === 0);
    if (!terms.length) terms = TERMS.filter(t => t.indexOf(ql) > -1);
    if (!terms.length && ql) terms = [ql];
    const words = ql.split(/\s+/).filter(Boolean);
    let hits = SPROD.filter(p => {
      const hay = (p.brand + ' ' + p.name).toLowerCase();
      return words.every(w => hay.indexOf(w) > -1);
    });
    if (!hits.length) hits = SPROD.slice(0, 4);

    return {
      q: q,
      hasQ: q.length > 0,
      showClear: q.length > 0 || this.state.focused,
      searchOpen: this.state.open && ql.length > 0,
      searchFocused: this.state.focused,
      searchPopular: this.state.focused && ql.length === 0,
      popularTerms: POPULAR.map(t => ({ label: t, onClick: this.pickTerm(t) })),
      rootRef: this.rootRef,
      mobSearchRef: this.mobSearchRef,
      mobBackdropStyle: {
        position: 'fixed', left: 0, right: 0, top: this.state.mobTop, bottom: 0,
        zIndex: 340, background: 'rgba(16,17,23,0.45)', animation: 'bbfade .18s ease both'
      },
      mobPanelStyle: {
        position: 'fixed', left: 0, right: 0, top: this.state.mobTop, bottom: 0, zIndex: 350
      },
      onQ: this.onQ, clearQ: this.clearQ, closeQ: this.closeQ,
      onFocusQ: this.onFocusQ, submitQ: this.submitQ,
      onKeyQ: (e) => {
        if (e.key === 'Enter') this.submitQ(e);
        else if (e.key === 'Escape') this.setState({ open: false, focused: false });
      },
      sugg: terms.slice(0, 4).map(t => ({ label: t, onClick: this.pickTerm(t) })),
      sitems: hits.slice(0, 4).map(p => ({
        brand: p.brand, name: p.name, price: p.price, old: p.old || '',
        onClick: this.openProd(p),
        imgStyle: {
          width: '100%', height: '100%', display: 'block',
          backgroundImage: 'url("' + p.img + '")', backgroundSize: 'contain',
          backgroundPosition: 'center', backgroundRepeat: 'no-repeat'
        },
        priceStyle: {
          fontSize: 15, fontWeight: 700, letterSpacing: '-0.02em', whiteSpace: 'nowrap',
          color: p.old ? '#DA0D00' : '#101117'
        }
      })),
      isDesktop: variant === 'desktop',
      isMobile: variant === 'mobile',
      isMobileBar: variant === 'mobile-bar',
      isDesktopBar: variant === 'desktop-bar',
      toggleMenu: toggle,
      onLogo: this.props.onLogo || ((e) => { if (e) e.preventDefault(); }),
      onAccount: this.props.onAccount || ((e) => { if (e) e.preventDefault(); }),
      accountLabel: this.props.loggedIn ? 'Moj profil' : 'Prijava',
      menuOpen: open,
      menuClosed: !open,
      cartCount: String(this.props.cartCount ?? 2),
      hasCart: (this.props.cartCount ?? 2) > 0,
      onCart: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.props.onCart) this.props.onCart(); },
      onWish: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.props.onWish) this.props.onWish(); },
      onContact: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.props.onContact) this.props.onContact(); },
      openNotice: (e) => { if (e && e.preventDefault) e.preventDefault(); if (window.BBEU) window.BBEU.openNotice(); },
      trigStyle: {
        background: open ? 'rgba(255,255,255,0.10)' : 'transparent',
        border: 'none',
        color: open ? '#fff' : 'rgba(255,255,255,0.95)',
        fontFamily: 'Inter,sans-serif', fontSize: 13, fontWeight: 600,
        paddingLeft: 14, paddingRight: 14, height: 44, transition: 'background .15s,color .15s',
        display: 'flex', alignItems: 'center', gap: 8, whiteSpace: 'nowrap', letterSpacing: '-0.01em'
      },
      mobBarStyle: {
        position: 'absolute', top: 0, left: 0, right: 0, height: 55, zIndex: 30,
        background: '#0050A0', display: 'flex', alignItems: 'center', gap: 8, padding: '0 16px',
        transform: this.props.scrolled ? 'translateY(0)' : 'translateY(-101%)',
        transition: 'transform .3s cubic-bezier(.2,.7,.3,1)',
        willChange: 'transform', backfaceVisibility: 'hidden',
        boxShadow: '0 2px 12px rgba(0,0,0,0.25)'
      },
      deskBarStyle: {
        position: 'fixed', top: 0, left: 0, right: 0, height: 56, zIndex: 320,
        background: '#0050A0',
        transform: this.props.scrolled ? 'translateY(0)' : 'translateY(-101%)',
        transition: 'transform .3s cubic-bezier(.2,.7,.3,1)',
        willChange: 'transform', backfaceVisibility: 'hidden',
        boxShadow: '0 2px 16px rgba(0,0,0,0.22)'
      }
    };
  }
}
</script>
</body>
</html>
