<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<section style="background:#00337A;border-radius:12px;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap">
  <div>
    <div style="font-size:11.5px;font-weight:600;letter-spacing:0.08em;color:#10DFBA;margin-bottom:8px">{{ eyebrow }}</div>
    <h2 style="font-size:23px;font-weight:700;letter-spacing:-0.02em;color:#fff;margin:0 0 9px">{{ title }}</h2>
    <p style="font-size:14.5px;line-height:1.55;color:rgba(255,255,255,0.8);margin:0;max-width:560px;text-wrap:pretty">{{ text }}</p>
  </div>
  <div style="display:flex;gap:12px;flex-shrink:0">
    <a href="{{ tel }}" style="display:flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:23px;background:#fff;color:#00337A;font-size:14.5px;font-weight:700;text-decoration:none;transition:opacity .15s" style-hover="opacity:0.9">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 0 0 6.5 6.5L17 13l4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 5.2 2 2 0 0 1 6 3z"></path></svg>
      {{ phone }}
    </a>
    <a href="{{ mailto }}" style="display:flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:23px;border:1px solid rgba(255,255,255,0.45);color:#fff;font-size:14.5px;font-weight:600;text-decoration:none;transition:border-color .15s,background .15s" style-hover="border-color:#fff;background:rgba(255,255,255,0.08)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><polyline points="3.5 6.5 12 13 20.5 6.5"></polyline></svg>
      {{ mailLabel }}
    </a>
  </div>
</section>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<section style="background:#00337A;padding:22px 16px;margin:0 16px;border-radius:12px">
  <div style="font-size:10.5px;font-weight:600;letter-spacing:0.08em;color:#10DFBA;margin-bottom:7px">{{ eyebrow }}</div>
  <h2 style="font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#fff;margin:0 0 7px">{{ title }}</h2>
  <p style="font-size:12.5px;line-height:1.5;color:rgba(255,255,255,0.8);margin:0 0 16px;text-wrap:pretty">{{ text }}</p>
  <div style="display:flex;flex-direction:column;gap:9px">
    <a href="{{ tel }}" style="display:flex;align-items:center;justify-content:center;gap:9px;height:44px;border-radius:22px;background:#fff;color:#00337A;font-size:14px;font-weight:700;text-decoration:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 0 0 6.5 6.5L17 13l4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 5.2 2 2 0 0 1 6 3z"></path></svg>
      {{ phone }}
    </a>
    <a href="{{ mailto }}" style="display:flex;align-items:center;justify-content:center;gap:9px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,0.45);color:#fff;font-size:14px;font-weight:600;text-decoration:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><polyline points="3.5 6.5 12 13 20.5 6.5"></polyline></svg>
      {{ mailLabel }}
    </a>
  </div>
</section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 190 },
  &quot;variant&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;desktop&quot;, &quot;mobile&quot;], &quot;default&quot;: &quot;desktop&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;eyebrow&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;KORISNIČKA PODRŠKA&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;title&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Naš tim podrške je tu za vas.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;text&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Pomoći ćemo oko narudžbi, plaćanja, dostave ili tehničkih pitanja. Dostupni smo svaki dan od 8 do 20h.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;phone&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;01 6655 555&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;email&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;podrska@bigbang.hr&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;mailLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mobile = p.variant === 'mobile';
    const phone = p.phone || '01 6655 555';
    const email = p.email || 'podrska@bigbang.hr';
    return {
      isDesktop: !mobile,
      isMobile: mobile,
      eyebrow: p.eyebrow || 'KORISNIČKA PODRŠKA',
      title: p.title || 'Naš tim podrške je tu za vas.',
      text: p.text || 'Pomoći ćemo oko narudžbi, plaćanja, dostave ili tehničkih pitanja. Dostupni smo svaki dan od 8 do 20h.',
      phone,
      tel: 'tel:' + phone.replace(/\s/g, ''),
      mailto: 'mailto:' + email,
      mailLabel: p.mailLabel || email
    };
  }
}
</script>
</body>
</html>
