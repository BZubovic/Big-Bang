<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</helmet>

<sc-if value="{{ isVertical }}" hint-placeholder-val="{{ true }}">
<a href="#" onClick="{{ open }}" class="imz" style="height:100%;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;color:#101117;text-decoration:none">
  <span style="position:relative;display:block;width:100%;aspect-ratio:960 / 676;overflow:hidden;flex-shrink:0">
    <span class="pimg" style="{{ imgStyle }}"></span>
    <sc-if value="{{ hasUrgency }}" hint-placeholder-val="{{ false }}">
      <span style="{{ urgStyle }}">{{ urgency }}</span>
    </sc-if>
  </span>
  <span style="{{ bodyStyle }}">
    <span style="{{ titleStyle }}">{{ title }}</span>
    <span style="{{ textStyle }}">{{ text }}</span>
    <span style="{{ metaStyle }}">
      <span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.75 9.625L7 12.6875L12.25 9.625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1.75 7L7 10.0625L12.25 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1.75 4.375L7 7.4375L12.25 4.375L7 1.3125L1.75 4.375Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ cat }}</span>
      <span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11.375 2.1875H2.625C2.38338 2.1875 2.1875 2.38338 2.1875 2.625V11.375C2.1875 11.6166 2.38338 11.8125 2.625 11.8125H11.375C11.6166 11.8125 11.8125 11.6166 11.8125 11.375V2.625C11.8125 2.38338 11.6166 2.1875 11.375 2.1875Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9.625 1.3125V3.0625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.375 1.3125V3.0625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.1875 4.8125H11.8125" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ date }}</span>
    </span>
  </span>
</a>
</sc-if>

<sc-if value="{{ isSide }}" hint-placeholder-val="{{ false }}">
<a href="#" onClick="{{ open }}" class="imz" style="{{ sideStyle }}">
  <span style="position:relative;display:block;width:58%;flex-shrink:0;overflow:hidden">
    <span class="pimg" style="{{ imgStyle }}"></span>
    <sc-if value="{{ hasUrgency }}" hint-placeholder-val="{{ false }}">
      <span style="{{ urgStyle }}">{{ urgency }}</span>
    </sc-if>
  </span>
  <span style="flex:1;min-width:0;padding:20px 22px;display:flex;flex-direction:column;gap:10px">
    <span style="display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.3">{{ title }}</span>
    <span style="display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:14px;color:#545F71;line-height:1.5">{{ text }}</span>
    <span style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:auto;padding-top:8px;font-size:12px;color:#8B95A5">
      <span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.75 9.625L7 12.6875L12.25 9.625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1.75 7L7 10.0625L12.25 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1.75 4.375L7 7.4375L12.25 4.375L7 1.3125L1.75 4.375Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ cat }}</span>
      <span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11.375 2.1875H2.625C2.38338 2.1875 2.1875 2.38338 2.1875 2.625V11.375C2.1875 11.6166 2.38338 11.8125 2.625 11.8125H11.375C11.6166 11.8125 11.8125 11.6166 11.8125 11.375V2.625C11.8125 2.38338 11.6166 2.1875 11.375 2.1875Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9.625 1.3125V3.0625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.375 1.3125V3.0625" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.1875 4.8125H11.8125" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ date }}</span>
    </span>
  </span>
</a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:520},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vertical&quot;,&quot;side&quot;,&quot;side-rev&quot;],&quot;default&quot;:&quot;vertical&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;promo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ img, title, text, cat, date, urgency? }&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p: any) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const pr = p.promo || {};
    const mobile = p.variant === 'mobile';
    const layout = mobile ? 'vertical' : (p.layout || 'vertical');
    const lg = p.size === 'lg' && !mobile;
    const fixed = mobile && !!p.fixedLines;
    const clampSt = (n, lh) => ({ display: '-webkit-box', WebkitBoxOrient: 'vertical', WebkitLineClamp: n, overflow: 'hidden', minHeight: n * lh, maxHeight: n * lh });
    const clip = (t, n) => !t ? '' : (t.length > n ? t.slice(0, t.lastIndexOf(' ', n)).replace(/[,.;:—-]+$/, '') + '…' : t);
    return {
      isVertical: layout === 'vertical',
      isSide: layout !== 'vertical',
      title: pr.title || '',
      text: mobile && !fixed ? clip(pr.text, 96) : (pr.text || ''),
      cat: pr.cat || '',
      date: pr.date || '',
      urgency: pr.urgency || '',
      hasUrgency: !!pr.urgency,
      open: (e) => { if (e) e.preventDefault(); if (p.onOpen) p.onOpen(pr); },
      imgStyle: { width: '100%', height: '100%', backgroundImage: 'url("' + (pr.img || '') + '")', backgroundSize: 'cover', backgroundPosition: 'center', display: 'block' },
      urgStyle: {
        position: 'absolute', top: mobile ? 10 : 14, left: mobile ? 10 : 14, display: 'inline-flex', alignItems: 'center',
        padding: mobile ? '4px 8px' : '5px 10px', borderRadius: 6, background: '#DA0D00', color: '#fff',
        fontSize: mobile ? 11 : 12, fontWeight: 700, lineHeight: 1.2, boxShadow: '0 4px 12px -4px rgba(0,0,0,0.35)'
      },
      bodyStyle: mobile
        ? { padding: '14px 16px 16px', display: 'flex', flexDirection: 'column', gap: 7, flex: 1 }
        : { padding: lg ? '22px 24px 22px' : '18px 20px 20px', display: 'flex', flexDirection: 'column', gap: 8, flex: 1 },
      titleStyle: mobile
        ? Object.assign({ fontSize: 14, fontWeight: 700, lineHeight: '19px', letterSpacing: '-0.01em' }, fixed ? clampSt(2, 19) : {})
        : { fontSize: lg ? 22 : 18, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1.3 },
      textStyle: mobile
        ? Object.assign({ fontSize: 12, color: '#545F71', lineHeight: '18px' }, fixed ? clampSt(3, 18) : {})
        : { fontSize: 15, color: '#545F71', lineHeight: 1.5 },
      metaStyle: mobile
        ? { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '6px 12px', marginTop: 'auto', paddingTop: 12, fontSize: 11, color: '#8B95A5' }
        : { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '8px 16px', marginTop: 'auto', paddingTop: 14, fontSize: 12, color: '#8B95A5' },
      sideStyle: {
        height: '100%', background: '#fff', borderRadius: 12, overflow: 'hidden', display: 'flex', color: '#101117', textDecoration: 'none',
        flexDirection: layout === 'side-rev' ? 'row-reverse' : 'row'
      }
    };
  }
}
</script>
</body>
</html>
