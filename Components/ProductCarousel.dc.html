<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<div style="width:100%;margin:52px 0 0;overflow:hidden">
  <sc-if value="{{ showHead }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding-left:max(20px,calc((100% - 1480px) / 2 + 20px));padding-right:max(20px,calc((100% - 1480px) / 2 + 20px));margin-bottom:18px">
    <div style="display:flex;align-items:baseline;gap:22px;min-width:0">
      <h2 style="font-size:24px;font-weight:600;color:#101117;letter-spacing:-0.02em">{{ title }}</h2>
      <sc-if value="{{ showAll }}" hint-placeholder-val="{{ true }}">
        <a href="#" class="arw" style="font-size:15px;font-weight:600;color:#0050A0;display:flex;align-items:center;gap:6px;white-space:nowrap">
          Prikaži sve
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-shrink:0">
      <button onClick="{{ scrollPrev }}" style="width:46px;height:46px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;color:#101117;transition:background .15s" style-hover="background:#E7E7EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button onClick="{{ scrollNext }}" style="width:46px;height:46px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;color:#101117;transition:background .15s" style-hover="background:#E7E7EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    </div>
  </div>
  </sc-if>
  <div ref="{{ trackRef }}" class="nsb" style="display:flex;gap:24px;overflow-x:auto;padding:8px max(20px,calc((100% - 1480px) / 2 + 20px)) 12px max(20px,calc((100% - 1480px) / 2 + 20px))">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="0">
      <div style="width:269px;flex-shrink:0;display:flex">
        <dc-import name="Components/ProductCard" variant="desktop" layout="{{ cardLayout }}" promo-var="{{ promoVar }}" card="{{ p.card }}" wish="{{ p.wish }}" on-open="{{ p.onOpen }}" on-remove-wish="{{ p.onRemoveWish }}" hint-size="269px,440px" style="width:100%"></dc-import>
      </div>
    </sc-for>
  </div>
  <div style="margin:20px max(20px,calc((100% - 1480px) / 2 + 20px)) 0;height:4px;border-radius:2px;background:#D8D8DE;position:relative;overflow:hidden">
    <div data-thumb="" style="position:absolute;top:0;left:0;height:100%;width:22%;border-radius:2px;background:#0050A0;will-change:transform"></div>
  </div>
</div>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="padding:36px 0 0 12px">
  <sc-if value="{{ showHead }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;align-items:center;justify-content:space-between;padding-right:12px;margin-bottom:12px">
    <h2 style="font-size:18px;font-weight:600;letter-spacing:-0.02em">{{ title }}</h2>
    <sc-if value="{{ showAll }}" hint-placeholder-val="{{ true }}">
      <a href="#" class="arw" style="font-size:13px;font-weight:600;color:#0050A0;display:flex;align-items:center;gap:5px;white-space:nowrap">Prikaži sve <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
    </sc-if>
  </div>
  </sc-if>
  <div class="nsb" ref="{{ trackRef }}" style="display:flex;gap:12px;overflow-x:auto;padding:6px 12px 10px 0">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="0">
      <div style="width:216px;flex-shrink:0;display:flex">
        <dc-import name="Components/ProductCard" variant="mobile" layout="{{ cardLayout }}" promo-var="{{ promoVar }}" card="{{ p.card }}" wish="{{ p.wish }}" on-open="{{ p.onOpen }}" on-remove-wish="{{ p.onRemoveWish }}" hint-size="216px,390px" style="width:100%"></dc-import>
      </div>
    </sc-for>
  </div>
  <div style="margin:10px 16px 0 0;height:4px;border-radius:2px;background:#D8D8DE;position:relative;overflow:hidden">
    <div data-thumb="" style="position:absolute;top:0;left:0;height:100%;width:28%;border-radius:2px;background:#0050A0;will-change:transform"></div>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;onOpenProduct&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(p: any) =&gt; void&quot; },
  &quot;onRemoveWish&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(p: any) =&gt; void&quot; },
  &quot;wishlist&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;showAll&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;hideHead&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;v3&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;$preview&quot;: {
    &quot;width&quot;: 1480,
    &quot;height&quot;: 560
  },
  &quot;variant&quot;: {
    &quot;editor&quot;: &quot;enum&quot;,
    &quot;options&quot;: [
      &quot;desktop&quot;,
      &quot;mobile&quot;
    ],
    &quot;default&quot;: &quot;desktop&quot;,
    &quot;tsType&quot;: &quot;string&quot;
  },
  &quot;title&quot;: {
    &quot;editor&quot;: &quot;text&quot;,
    &quot;default&quot;: &quot;UAU hot deals tjedna!&quot;,
    &quot;tsType&quot;: &quot;string&quot;
  },
  &quot;step&quot;: {
    &quot;editor&quot;: &quot;int&quot;,
    &quot;default&quot;: 1172,
    &quot;tsType&quot;: &quot;number&quot;
  },
  &quot;products&quot;: {
    &quot;editor&quot;: null,
    &quot;tsType&quot;: &quot;Product[]&quot;
  }
}">
class Component extends DCLogic {
  state = { prog: 0 };
  trackRef = React.createRef();


  renderVals() {
    const s = this.state;
    const open = this.props.onOpenProduct || (() => {});
    const list = this.props.products || [];
    const mobile = this.props.variant === 'mobile';
    const budget = mobile ? 26 : 52;
    const clip = (t, n) => (String(t).length > n ? String(t).slice(0, n - 1).replace(/[\s,.;:-]+$/, '') + '…' : String(t));
        const AVAIL = [
          { text: 'Na zalihi', tone: 'in' },
          { text: 'Na zalihi', tone: 'in' },
          { text: 'Dostupno za 2 – 3 radna dana', tone: 'wait' },
          { text: 'Na zalihi kod prodavatelja', tone: 'in' }
        ];
        const num = (v) => parseFloat(String(v || '').replace(/[^0-9,]/g, '').replace(',', '.')) || 0;
        const decorate = (p, i) => {
          const pills = [];
          const refurb = i % 7 === 5;
          if (refurb) pills.push({ label: 'Obnovljeno', tone: 'lime' });
          else if (i % 4 !== 3) pills.push({ label: 'Besplatna dostava', tone: 'navy' });
          if (i % 5 === 1) pills.push({ label: 'Razrezana cena', tone: 'blue' });
          if (/Philips XV5113/.test(p.name || '')) pills.push({ label: 'Besplatna montaža', tone: 'blue' });
          const rated = i % 7 === 0 || i % 7 === 4 || i % 7 === 2;
          const av = AVAIL[i % 4];
          return {
            card: {
              img: p.img, name: p.name, price: p.price, old: p.old || '',
              rate: p.rate && String(p.rate).indexOf('rata') > -1 ? p.rate : '25,99 € / 12 rata',
              options: this.props.noReviews ? 0 : (i % 4 === 1 ? 6 : 0),
              renewedSave: refurb ? '-' + (Math.round(num(p.price) * 0.2)) + ',00 €' : '',
              cashback: i % 5 === 0 ? '100' : '', warranty: i % 5 === 0 ? '5' : '',
              energy: /^tv |televizor/i.test(p.name || '') ? ['F', 'E', 'G'][i % 3] : (i % 4 === 2 ? '' : (i % 3 === 1 ? 'G' : 'A')),
              pills: i === 1 ? [{ label: 'Besplatna dostava', tone: 'navy' }, { label: 'Razrezana cena', tone: 'blue' }, { label: 'Besplatna montaža', tone: 'blue' }, { label: 'Poklon uz kupnju', tone: 'red' }, { label: 'Dostava 24 h', tone: 'navy' }] : pills,
              rating: rated && !this.props.noReviews ? 4 : 0, reviews: [218, 96, 47, 312, 15, 64][i % 6],
              avail: av.text, availTone: av.tone, seller: 'Big Bang',
              codePct: refurb || i % 4 === 3 ? 0 : 20,
              anchor: p.anchor || p.old || p.price, anchorDate: p.anchorDate || '10.09.2026.',
              // v3: the „Kartica V3” card (vertical layout, no stock / seller / instalments, labels top left, energy on the image)
              lean: !!this.props.v3, v3: !!this.props.v3,
              // v3: several promo codes per product like Stolna računala (same coupons as PROMO_TERMS in Category body); card shows the highest
              ...(this.props.v3 && !refurb && i % 4 !== 3 ? (() => {
                const ALL = [
                  { pct: 10, code: 'VISA10', title: 'Iskoristi Visa dodatne uštede', cond: 'Samo za plaćanje Visa karticom uz Apple Pay ili Google Pay', period: '21.10. – 26.10.2026.',
                    terms: 'Iskoristi 10% popusta za plaćanje Visa karticama koristeći Apple ili Google Pay uz promo kod VISA10 u periodu od 21.10. do 26.10.2026. Vrijedi za jednokratno plaćanje i plaćanje do 36 rata i ne zbraja se s drugim promo popustima.' },
                  { pct: 20, code: 'UAU20', title: 'Dodatna ušteda za članove UAU Kluba', cond: 'Samo za prijavljene članove UAU Kluba pri online kupnji', period: '21.10. – 31.10.2026.',
                    terms: 'Iskoristi 20% popusta za članove UAU Kluba uz promo kod UAU20 pri online kupnji u periodu od 21.10. do 31.10.2026. Potrebna je prijava u korisnički račun UAU Kluba. Kod vrijedi jednom po kupcu, ne vrijedi u poslovnicama i ne zbraja se s drugim promo popustima.' },
                  { pct: 15, code: 'MASTER15', title: 'Iskoristi Mastercard dodatne uštede', cond: 'Samo za Mastercard kreditne kartice, plaćanje na 12 ili više rata', period: '22.10. – 2.11.2026.',
                    terms: 'Iskoristi 15% popusta za plaćanje Mastercard kreditnim karticama na 12 ili više rata uz promo kod MASTER15 u periodu od 22.10. do 2.11.2026. Ne vrijedi za debitne kartice ni jednokratno plaćanje i ne zbraja se s drugim promo popustima.' }
                ];
                const set = [[0, 2], [1, 0, 2], [2], [0]][i % 4].map(k => ALL[k]);
                const top = set.slice().sort((a, b) => b.pct - a.pct)[0];
                return { codePct: top.pct, promoCode: top.code, promoCodes: set, promoTitle: top.title, promoCond: top.cond, promoPeriod: top.period, promoTerms: top.terms };
              })() : {})
            },
            wish: !!this.props.wishlist,
            onOpen: () => open(p),
            onRemoveWish: () => { if (this.props.onRemoveWish) this.props.onRemoveWish(p); }
          };
        };
    return {
      cardLayout: this.props.v3 ? 'vertical' : 'minimal',
      // v3 slider uses the Stolna računala default promo look (design 8: chip, „do” amount, „Uvjeti ›” → all codes flyout)
      promoVar: this.props.v3 ? 8 : 0,
      isDesktop: !mobile,
      isMobile: mobile,
      title: this.props.title || '',
      showAll: this.props.showAll !== false && !this.props.wishlist,
      showHead: !this.props.hideHead,
      products: (() => { const ps = list.map(decorate); const rr = ps.some(p => p.card.rating), ro = ps.some(p => p.card.options), rp = ps.some(p => { const c = p.card; return (c.codePct > 0 || !!c.renewedSave); }); ps.forEach(p => { p.card.rowRating = rr; p.card.rowOptions = ro; p.card.rowPromo = rp; }); return ps; })(),
      trackRef: this.trackRef,
      scrollPrev: () => this.scrollBy(-1),
      scrollNext: () => this.scrollBy(1),
      onTrackScroll: e => {
        const el = e.currentTarget, span = el.scrollWidth - el.clientWidth;
        const frac = span > 0 ? el.scrollLeft / span : 0;
        if (Math.abs(s.prog - frac) > 0.005) this.setState({ prog: frac });
      },
      progStyle: {
        position: 'absolute', top: 0, height: '100%', borderRadius: 2,
        background: '#0050A0', width: (mobile ? 28 : 22) + '%', left: (s.prog * (100 - (mobile ? 28 : 22))) + '%'
      }
    };
  }

  scrollBy(dir) {
    const el = this.trackRef.current;
    if (el) el.scrollBy({ left: dir * (this.props.step || 1172), behavior: 'smooth' });
  }
}
</script>
</body>
</html>
