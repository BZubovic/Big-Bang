<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

<sc-if value="{{ showV2Desktop }}" hint-placeholder-val="{{ false }}">
  <div>
    <div onClick="{{ closeMenu }}" style="position:fixed;left:0;right:0;top:116px;bottom:0;background:rgba(16,17,23,0.45);z-index:200"></div>
    <div style="position:absolute;left:0;right:0;top:116px;z-index:210">
      <div style="max-width:1480px;margin:0 auto;padding-left:26px;position:relative">
        <div style="position:absolute;left:74px;top:-7px;width:18px;height:8px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:2"></div>
        <div style="width:1160px;max-width:100%;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,0.20);display:flex;height:calc(100vh - 152px);max-height:700px;overflow:hidden">

        <div class="nsb" style="width:222px;flex-shrink:0;background:#EDEDF0;overflow-y:auto;padding:26px 0 12px">
          <sc-for list="{{ l1sV2 }}" as="c" hint-placeholder-count="12">
            <button onClick="{{ c.onClick }}" onMouseEnter="{{ c.onClick }}" style="{{ c.style }}">
              <span>{{ c.name }}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </sc-for>
        </div>

        <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding-top:26px">
        <div class="bbsb" style="flex:1;min-height:0;overflow-y:auto;padding:0 32px 36px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px">
            <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.025em;color:#101117">{{ activeName }}</h2>
            <a href="#" onClick="{{ openL1 }}" class="arw" style="font-size:13px;font-weight:700;color:#0050A0;display:flex;align-items:center;gap:6px">
              Prikaži sve u kategoriji
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
            </a>
          </div>
          <div style="column-count:3;column-gap:32px">
            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
              <div style="break-inside:avoid;margin-bottom:26px">
                <a href="#" onClick="{{ g.onClick }}" style="display:block;font-size:14px;font-weight:700;color:#101117;letter-spacing:-0.01em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #E4E4EA" style-hover="color:#0050A0">{{ g.name }}</a>
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                  <a href="#" onClick="{{ it.onClick }}" style="display:block;font-size:13px;font-weight:400;color:#545F71;padding:5px 0;line-height:1.35" style-hover="color:#0050A0">{{ it.name }}</a>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>

        </div>
        <div style="width:296px;flex-shrink:0;padding:26px 40px 24px 20px;display:flex;flex-direction:column;gap:14px;border-left:1px solid #E4E4EA">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:#8B95A5">Istaknuto</div>
          <a href="#" style="display:block;border-radius:12px;overflow:hidden">
            <img src="images/offer-best-6.webp" alt="" style="width:100%;display:block">
          </a>
          <a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-radius:12px;background:#F5F5F8;font-size:13px;font-weight:700;color:#101117" style-hover="background:#EBEBF0;color:#0050A0">
            Akcije i promocije
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
          </a>
          <a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-radius:12px;background:#F5F5F8;font-size:13px;font-weight:700;color:#101117" style-hover="background:#EBEBF0;color:#0050A0">
            Outlet i obnovljeno
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
          </a>
        </div>

        </div>
      </div>
    </div>
  </div>
</sc-if>

    ['Školska oprema', ['Ruksaci','Pernice','Pisaći pribor','Sveske']],
    ['Uredski materijal', ['Papir','Registratori','Ljepila i škare']],
    ['Uredska tehnika', ['Kalkulatori','Uništavači papira','Laminatori']]
  ]],
  ['Auto-moto', [
    ['Auto elektronika', ['Auto radio','Navigacija','Auto kamere','Parking senzori']],
    ['Održavanje', ['Usisavači za auto','Kompresori','Startna pomoć','Auto kozmetika']],
    ['Električna vozila', ['EV punjači','Kablovi za punjenje','Zidne stanice']]
  ]],
  ['Kućni ljubimci', [
    ['Psi', ['Hrana za pse','Ležajevi','Povodci','Igračke za pse']],
    ['Mačke', ['Hrana za mačke','Toaleti','Grebalice']],
    ['Oprema', ['Automatske hranilice','Fontane za vodu','Transporteri']]
  ]],
  ['Glazba i glazbala', [
    ['Instrumenti', ['Gitare','Klavijature','Bubnjevi','Ukulele']],
    ['Studio', ['Audio interfejsi','Studijski monitori','Mikrofoni','MIDI kontroleri']],
    ['Dodaci', ['Kablovi','Stalci','Torbe za instrumente']]
  ]],
  ['Supermarket', [
    ['Napitci', ['Kava','Čaj','Sokovi','Voda']],
    ['Kućne potrepštine', ['Deterdženti','Sredstva za čišćenje','Papirna konfekcija']],
    ['Baterije i žarulje', ['Baterije','Punjive baterije','Žarulje']]
  ]],
  ['Obnovljeno', [
    ['Obnovljeni uređaji', ['Obnovljeni mobiteli','Obnovljeni laptopi','Obnovljeni tableti','Obnovljene konzole']],
    ['Outlet', ['Bijela tehnika outlet','TV outlet','Mali aparati outlet']]
  ]]
];

let TREE_CACHE = null;
function getTree() {
  if (TREE_CACHE) return TREE_CACHE;
  const src = (typeof window !== 'undefined' && window.BB_CATALOG) || CATALOG_LEGACY;
  const t = src.map(function (l1, li) {
    return {
      name: l1[0],
      groups: l1[1].map(function (g, gi) {
        var seed = (li * 5 + gi * 3) % POOL.length;
        var L3 = (typeof window !== 'undefined' && window.BB_L3IMG) || {};
        var GRP = (typeof window !== 'undefined' && window.BB_GRPIMG) || {};
        var groupFile = GRP[g[0]];
        var usedGroupFallback = false;
        var fbIdx = 0;
        return {
          name: g[0],
          items: g[1].map(function (n, ii) {
            var file = L3[n];
            if (file) return { name: n, img: 'images/c/' + file, hasImg: true };
            // no artwork for this label: group photo once, then a neutral well —
            // never an unrelated product photo under a caption
            if (groupFile && !usedGroupFallback) {
              usedGroupFallback = true;
              return { name: n, img: 'images/c/' + groupFile, hasImg: true };
            }
            fbIdx++;
            return { name: n, img: null, hasImg: false, noImg: true };
          })
        };
      })
    };
  });
  if (typeof window !== 'undefined' && window.BB_CATALOG) TREE_CACHE = t;
  return t;
}

class Component extends DCLogic {
  state = { l1: 0, mLevel: 0, mL1: 0, mL2: 0 };
  listRef = React.createRef();
  _lastLevel = 0;

  prefetchImages() {
    const tree = getTree();
    if (!tree || !tree.length) return;
    const urls = [];
    tree.forEach(function (l1) {
      l1.groups.forEach(function (g) {
        g.items.forEach(function (it) { if (it.img) urls.push(it.img); });
      });
    });
    const seen = {};
    const queue = urls.filter(function (u) {
      if (seen[u]) return false;
      seen[u] = 1;
      return true;
    });
    // Runs at most once — a second entry (catalog poll) would otherwise clobber
    // the shared timer/array and kill the in-flight chain.
    if (this._preloadStarted) return;
    this._preloadStarted = true;
    // Assets are served no-cache, so the HTTP cache won't carry a prefetch over
    // to the DOM <img>. Retaining the Image objects for the session keeps the
    // decoded bitmaps in the memory cache — that is what removes the flicker.
    this._preload = [];
    const hold = u => {
      const img = new Image();
      this._preload.push(img);
      img.src = u;
    };
    queue.splice(0, 60).forEach(hold);
    let i = 0;
    const step = () => {
      const batch = queue.slice(i, i + 24);
      if (!batch.length) return;
      batch.forEach(hold);
      i += 24;
      this._preloadTimer = setTimeout(step, 120);
    };
    this._preloadTimer = setTimeout(step, 200);
  }

  componentDidMount() {
    this.prefetchImages();
    if (!window.BB_CATALOG) {
      this.catPoll = setInterval(() => {
        if (window.BB_CATALOG) { clearInterval(this.catPoll); this.forceUpdate(); this.prefetchImages(); }
      }, 120);
    }
  }
  componentWillUnmount() { clearInterval(this.catPoll); clearTimeout(this._preloadTimer); }
  componentDidUpdate(prevProps) {
    if (prevProps.variant !== this.props.variant) this.setState({ mLevel: 0, l1: 0 });
    if (!prevProps.open && this.props.open) this.setState({ mLevel: 0 });
    if (this._lastLevel !== this.state.mLevel) {
      const from = this._lastLevel;
      this._lastLevel = this.state.mLevel;
      const el = this.listRef.current;
      if (el && el.animate) {
        const dir = this.state.mLevel > from ? 1 : -1;
        el.animate(
          [
            { transform: 'translateX(' + (dir * 34) + '%)', opacity: 0 },
            { transform: 'translateX(0)', opacity: 1 }
          ],
          { duration: 260, easing: 'cubic-bezier(0.2,0,0.2,1)', fill: 'both' }
        );
      }
    }
  }

  renderVals() {
    const TREE = getTree();
    const s = this.state;
    const mobile = this.props.variant === 'mobile';
    const open = !!this.props.open;
    const active = TREE[s.l1] || TREE[0];

    const l1Style = (i, size) => ({
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
      width: '100%', textAlign: 'left', border: 'none', background: i === s.l1 ? '#fff' : 'transparent',
      color: i === s.l1 ? '#0050A0' : '#545F71',
      fontFamily: 'Inter,sans-serif', fontSize: size, fontWeight: i === s.l1 ? 700 : 500,
      letterSpacing: '-0.01em', padding: mobile ? '12px 12px' : '13px 22px', lineHeight: 1.3,
      boxShadow: i === s.l1 ? 'inset 3px 0 0 #0050A0' : 'none'
    });
    const mkL1 = size => TREE.map((c, i) => ({ name: c.name, style: l1Style(i, size), onClick: () => this.setState({ l1: i }) }));

    const close = this.props.onClose || (() => {});
    const nav = this.props.onOpenCategory || (() => {});
    const goCat = (payload) => (e) => { if (e && e.preventDefault) e.preventDefault(); close(); nav(payload); };

    const groups = active.groups.map((g, i) => ({
      name: g.name,
      onClick: goCat({ level: 2, l1: active.name, l2: g.name }),
      items: g.items.map(it => ({ name: it.name, onClick: goCat({ level: 3, l1: active.name, l2: g.name, l3: it.name }) })),
      wrapStyle: { paddingBottom: 18, marginBottom: 18, borderBottom: i < active.groups.length - 1 ? '1px solid #E4E4EA' : 'none' },
      mobWrapStyle: { paddingBottom: 18, marginBottom: 18, borderBottom: i < active.groups.length - 1 ? '1px solid #E4E4EA' : 'none' }
    }));

    let mobItems = [], mobTitle = 'Kategorije', showAllLink = false, showAllLabel = '', showAllClick = (e) => { if (e) e.preventDefault(); };
    if (s.mLevel === 0) {
      mobItems = TREE.map((c, i) => ({ name: c.name, hasChildren: true, onClick: () => this.setState({ mLevel: 1, mL1: i }) }));
    } else if (s.mLevel === 1) {
      const l1 = TREE[s.mL1];
      mobTitle = l1.name;
      showAllLink = true;
      showAllLabel = 'Prikaži sve — ' + l1.name;
      showAllClick = goCat({ level: 1, l1: l1.name });
      mobItems = l1.groups.map((g, i) => ({ name: g.name, hasChildren: true, onClick: () => this.setState({ mLevel: 2, mL2: i }) }));
    } else {
      const g = TREE[s.mL1].groups[s.mL2];
      mobTitle = g.name;
      showAllLink = true;
      showAllLabel = 'Prikaži sve — ' + g.name;
      showAllClick = goCat({ level: 2, l1: TREE[s.mL1].name, l2: g.name });
      mobItems = g.items.map(it => ({ name: it.name, hasChildren: false, onClick: goCat({ level: 3, l1: TREE[s.mL1].name, l2: g.name, l3: it.name }) }));
    }

    return {
      showV2Desktop: !mobile && open,
      showV2Mobile: mobile && open,
      closeMenu: this.props.onClose || (() => {}),
      l1sV2: mkL1(14),
      groups: groups,
      activeName: active.name,
      mobItems: mobItems,
      mobTitle: mobTitle,
      canGoBack: s.mLevel > 0,
      showAllLink: showAllLink,
      showAllLabel: showAllLabel,
      showAllClick: showAllClick,
      openL1: goCat({ level: 1, l1: active.name }),
      goBack: () => this.setState(p => ({ mLevel: Math.max(0, p.mLevel - 1) })),
      listRef: this.listRef
    };
  }
}
</script>
