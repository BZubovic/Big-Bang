<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<nav style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#545F71;padding-bottom:26px">
  <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2">
    <a href="#" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</a>
    <sc-if value="{{ c.sep }}" hint-placeholder-val="{{ true }}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8B95A5" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </sc-if>
  </sc-for>
</nav>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<nav style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:#545F71;padding-bottom:22px">
  <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2">
    <a href="#" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</a>
    <sc-if value="{{ c.sep }}" hint-placeholder-val="{{ true }}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8B95A5" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </sc-if>
  </sc-for>
</nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 900, &quot;height&quot;: 40 },
  &quot;variant&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;desktop&quot;, &quot;mobile&quot;], &quot;default&quot;: &quot;desktop&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;items&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;{label: string, onClick?: () =&gt; void}[]&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const mobile = this.props.variant === 'mobile';
    const items = this.props.items || [];
    return {
      isDesktop: !mobile,
      isMobile: mobile,
      crumbs: items.map((c, i) => ({
        label: c.label,
        sep: i < items.length - 1,
        onClick: (e) => { if (e) e.preventDefault(); if (c.onClick) c.onClick(e); },
        style: { color: i === items.length - 1 ? '#101117' : '#0050A0', fontWeight: i === items.length - 1 ? 600 : 400, textDecoration: 'none' }
      }))
    };
  }
}
</script>
</body>
</html>
