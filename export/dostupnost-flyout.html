<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang — Dostupnost flyout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#F1F1F4;font-family:Inter,sans-serif;color:#101117}
  a{color:#0050A0}a:hover{color:#002D73}
</style>
<script src="../stores-data.js"></script>
<script src="../availability-flyout.js"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#002D73"/><path d="M50 78s-18-15.9-18-29.5A18 18 0 0 1 68 48.5C68 62.1 50 78 50 78z" fill="none" stroke="#10DFBA" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="48" r="6" fill="#10DFBA"/></svg></template>
<div style="max-width:560px;padding:32px 24px;display:flex;flex-direction:column;gap:16px">
  <div style="font-size:24px;font-weight:600;letter-spacing:-0.02em">Dostupnost — flyout</div>
  <div style="font-size:14px;color:#545F71">Odaberite scenarij. Flyout se otvara s desne strane.</div>
  <div id="sc" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script>
  var S = [
    [false, true, '1. Nema na zalihi, izloženi primjerak postoji'],
    [false, false, '2. Nema na zalihi, nema izloženog primjerka'],
    [true, false, '3. Ima na zalihi, nema izloženog primjerka'],
    [true, true, '4. Ima na zalihi, izloženi primjerak postoji']
  ];
  var product = { img: '', name: 'Samsung Galaxy S24+ 5G Dual SIM SM-S926B 12/256GB', price: '1.099,99', old: '1.299,99' };
  var wrap = document.getElementById('sc');
  S.forEach(function (s) {
    var inf = BBAvail.info(s[0], s[1]);
    var b = document.createElement('button');
    b.setAttribute('style', 'display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-family:Inter,sans-serif;background:#fff;border:1px solid #E3E4E9');
    b.innerHTML = '<span style="font-size:12px;color:#545F71">' + s[2] + '</span><span style="font-size:14px;font-weight:700">' + inf.title + '</span><span style="font-size:12px;color:#545F71">' + inf.sub + '</span>';
    b.onclick = function () { BBAvail.open({ inStock: s[0], shown: s[1], product: product }); };
    wrap.appendChild(b);
  });
  BBAvail.open({ inStock: true, shown: true, product: product });
</script>
</body>
</html>
