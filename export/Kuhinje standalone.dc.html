<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mob: typeof window !== 'undefined' && window.innerWidth < 768, sy: 0 };
  componentDidMount() {
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => {
        this.raf = 0;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        const d = y > 130, m = y > 120;
        if (d !== this.state.d || m !== this.state.m) this.setState({ d, m });
      });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    this.onResize = () => { const m = window.innerWidth < 768; if (m !== this.state.mob) this.setState({ mob: m }); };
    window.addEventListener('resize', this.onResize);
    const R = window.__resources;
    if (!R) return;
    const fixImg = (el) => {
      const v = el.getAttribute('src');
      if (v && R[v] && v !== R[v]) el.setAttribute('src', R[v]);
    };
    const fixStyle = (el) => {
      const st = el.getAttribute('style');
      if (!st || st.indexOf('images/') < 0) return;
      const n = st.replace(/url\((['"]?)(images\/[^'")]+)\1\)/g, (m, q, p) => R[p] ? 'url(' + R[p] + ')' : m);
      if (n !== st) el.setAttribute('style', n);
    };
    const scan = (root) => {
      if (root.nodeType !== 1) return;
      if (root.tagName === 'IMG') fixImg(root);
      fixStyle(root);
      root.querySelectorAll('img').forEach(fixImg);
      root.querySelectorAll('[style*="images/"]').forEach(fixStyle);
    };
    scan(document.body);
    this.mo = new MutationObserver((list) => {
      list.forEach((m) => {
        if (m.type === 'attributes') { if (m.attributeName === 'src' && m.target.tagName === 'IMG') fixImg(m.target); else if (m.attributeName === 'style') fixStyle(m.target); }
        else m.addedNodes.forEach(scan);
      });
    });
    this.mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'style'] });
  }
  componentWillUnmount() { if (this.mo) this.mo.disconnect(); window.removeEventListener('resize', this.onResize); window.removeEventListener('scroll', this.onScroll); }
  renderVals() { return { isDesktop: !this.state.mob, isMobile: this.state.mob, deskScrolled: !!this.state.d, mobScrolled: !!this.state.m }; }
}
</script>
