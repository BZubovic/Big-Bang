<div style="min-height:100vh;background:#F1F1F4">

      <dc-import name="Components/SiteHeader" variant="mobile-bar" scrolled="{{ mobScrolled }}" cart-count="4" hint-size="100%,55px"></dc-import>

    </div>
    </div>
  </sc-if>

    <sc-if value="{{ psOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:0;bottom:56px;width:260px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.20);padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span style="font-size:14px;font-weight:700;color:#101117">Prototype settings</span>
          <button type="button" onClick="{{ togglePs }}" aria-label="Zatvori" style="width:28px;height:28px;border:none;background:#F1F1F4;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#101117"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:#545F71;margin-bottom:6px">PRIKAZ</div>
        <div style="display:flex;gap:4px;padding:4px;border-radius:22px;background:#F1F1F4">
          <button type="button" onClick="{{ setDesk }}" style="{{ deskBtn }}">Desktop</button>
          <button type="button" onClick="{{ setMob }}" style="{{ mobBtn }}">Mobile</button>
        </div>
      </div>
    </sc-if>
    <button type="button" onClick="{{ togglePs }}" aria-label="Prototype settings" style="width:46px;height:46px;border-radius:50%;border:none;background:#002D73;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.20);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mob: typeof window !== 'undefined' && window.innerWidth < 768, ps: false };
  componentDidMount() {
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = setTimeout(() => {
        this.raf = 0;
        const y = this.state.mob && this.mobEl ? this.mobEl.scrollTop : (window.scrollY || document.documentElement.scrollTop || 0);
        const d = y > 130, m = y > 120;
        if (d !== this.state.d || m !== this.state.m) this.setState({ d, m });
      }, 16);
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    if (this.mobEl) this.mobEl.addEventListener('scroll', this.onScroll, { passive: true });
    document.body.classList.toggle('bbmob', !!this.state.mob);
    this.onScroll();
    const R = window.__resources;
    if (!R) return;
    const key = (v) => v && v.replace(/^(\.\.\/|\.\/)+/, '');
    const fixAttr = (el, a) => { const v = el.getAttribute(a), k = key(v); if (k && R[k] && v !== R[k]) el.setAttribute(a, R[k]); };
    const fixStyle = (el) => {
      const st = el.getAttribute('style');
      if (!st || st.indexOf('images/') < 0) return;
      const n = st.replace(/url\((['"]?)((?:\.\.\/)?images\/[^'")]+)\1\)/g, (m, q, p) => R[key(p)] ? 'url(' + R[key(p)] + ')' : m);
      if (n !== st) el.setAttribute('style', n);
    };
    const fixEl = (el) => {
      if (el.tagName === 'IMG' || el.tagName === 'SOURCE') fixAttr(el, 'src');
      if (el.tagName === 'VIDEO') { fixAttr(el, 'src'); fixAttr(el, 'poster'); }
      fixStyle(el);
    };
    const scan = (root) => { if (root.nodeType !== 1) return; fixEl(root); root.querySelectorAll('img,video,source,[style*="images/"]').forEach(fixEl); };
    scan(document.body);
    this.mo = new MutationObserver((list) => list.forEach((m) => { if (m.type === 'attributes') fixEl(m.target); else m.addedNodes.forEach(scan); }));
    this.mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'poster', 'style'] });
  }
  mobRef = (el) => {
    if (this.mobEl && this.onScroll) this.mobEl.removeEventListener('scroll', this.onScroll);
    this.mobEl = el;
    if (el && this.onScroll) el.addEventListener('scroll', this.onScroll, { passive: true });
  };
  componentDidUpdate() { document.body.classList.toggle('bbmob', !!this.state.mob); }
  componentWillUnmount() { if (this.mo) this.mo.disconnect(); window.removeEventListener('scroll', this.onScroll); }
  renderVals() {
    const mob = this.state.mob;
    const seg = (on) => ({ flex: 1, height: 36, borderRadius: 18, border: 'none', cursor: 'pointer', fontFamily: 'Inter,sans-serif', fontSize: 13.5, fontWeight: on ? 700 : 500, background: on ? '#002D73' : 'transparent', color: on ? '#fff' : '#101117' });
    const set = (m) => () => this.setState({ mob: m, d: false, m: false }, () => { window.scrollTo(0, 0); if (this.mobEl) this.mobEl.scrollTop = 0; });
    return {
      mobRef: this.mobRef,
      isDesktop: !mob, isMobile: mob, deskScrolled: !!this.state.d, mobScrolled: !!this.state.m,
      psOpen: this.state.ps, togglePs: () => this.setState(s => ({ ps: !s.ps })),
      setDesk: set(false), setMob: set(true), deskBtn: seg(!mob), mobBtn: seg(mob)
    };
  }
}
</script>
