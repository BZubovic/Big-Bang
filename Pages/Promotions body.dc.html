<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<div style="background:#F1F1F4;font-family:Inter,sans-serif;color:#101117;padding-bottom:72px">
  <dc-import name="Components/InfoPageHead" variant="desktop" heading="Akcije i promocije" intro="Sve aktualne akcije, popusti i promo kodovi na jednom mjestu." on-home="{{ onHome }}" hint-size="100%,170px"></dc-import>
  <div style="position:relative;margin-top:28px">
    <div class="nsb" ref="{{ catRef }}" onScroll="{{ onCatScroll }}" style="display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:4px 20px 6px max(20px,calc((100% - 1480px) / 2 + 20px))">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="9">
        <a href="#" onClick="{{ c.onClick }}" style="width:112px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:#101117">
          <span style="{{ c.ringStyle }}">
            <sc-if value="{{ c.isAll }}" hint-placeholder-val="{{ false }}">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="#DA0D00"><path d="M12.9 2.2c.3-.3.8-.2 1 .2 1 2 3.1 3.5 4.5 5.4A8.3 8.3 0 0 1 20 12.8C20 17.3 16.4 21 12 21s-8-3.7-8-8.2c0-2.3.9-4.3 2.4-5.8.3-.3.9-.2 1 .3.3 1.2 1 2.2 2 2.8-.1-3.2 1.3-5.6 3.5-6.9zM12 19c1.9 0 3.4-1.4 3.4-3.2 0-1.6-1-2.6-2.1-3.5-.5.9-1.3 1.6-2.3 1.9-.5.1-1-.2-1-.7v-.3c-.9.7-1.4 1.6-1.4 2.6C8.6 17.6 10.1 19 12 19z"></path></svg>
            </sc-if>
            <sc-if value="{{ c.hasImg }}" hint-placeholder-val="{{ true }}">
              <span style="{{ c.imgStyle }}"></span>
            </sc-if>
          </span>
          <span style="{{ c.labelStyle }}">{{ c.label }}</span>
        </a>
      </sc-for>
    </div>
    <div style="position:absolute;top:0;left:0;right:0;height:96px;pointer-events:none">
      <div style="position:relative;max-width:1480px;height:100%;margin:0 auto">
        <button type="button" onClick="{{ catPrev }}" aria-label="Prethodne kategorije" style="{{ prevStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <button type="button" onClick="{{ catNext }}" aria-label="Sljedeće kategorije" style="{{ nextStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      </div>
    </div>
    <div style="max-width:1480px;margin:0 auto;padding:0 20px">
      <div style="margin-top:18px;height:4px;border-radius:2px;background:#D8D8DE;position:relative;overflow:hidden"><div style="{{ catProgStyle }}"></div></div>
    </div>
  </div>
  <div style="max-width:1480px;margin:0 auto;padding:0 20px">

    <sc-if value="{{ showFeatured }}" hint-placeholder-val="{{ true }}">
      <h2 style="font-size:24px;font-weight:600;letter-spacing:-0.02em;margin:44px 0 18px">Odabrane akcije i promocije</h2>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px">
        <dc-import name="Components/PromoCard" variant="desktop" size="lg" promo="{{ feat0 }}" on-open="{{ openPromo }}" hint-size="100%,620px"></dc-import>
        <div style="display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:24px">
          <dc-import name="Components/PromoCard" variant="desktop" layout="side-rev" promo="{{ feat1 }}" on-open="{{ openPromo }}" hint-size="100%,100%"></dc-import>
          <dc-import name="Components/PromoCard" variant="desktop" layout="side" promo="{{ feat2 }}" on-open="{{ openPromo }}" hint-size="100%,100%"></dc-import>
        </div>
      </div>
    </sc-if>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:52px 0 18px">
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <h2 style="font-size:24px;font-weight:600;letter-spacing:-0.02em;margin:0">{{ listTitle }}</h2>
        <span style="font-size:14px;color:#545F71">{{ countLabel }}</span>
      </div>
      <div style="display:flex;gap:4px;padding:4px;background:#fff;border-radius:10px">
        <sc-for list="{{ sorts }}" as="so" hint-placeholder-count="2">
          <button type="button" onClick="{{ so.onClick }}" style="{{ so.style }}">{{ so.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px">
      <sc-for list="{{ shown }}" as="pr" hint-placeholder-count="6">
        <dc-import name="Components/PromoCard" variant="desktop" promo="{{ pr }}" on-open="{{ openPromo }}" hint-size="100%,470px"></dc-import>
      </sc-for>
    </div>

    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:36px">
        <span style="font-size:13px;color:#545F71">{{ progressLabel }}</span>
        <div style="width:220px;height:4px;border-radius:2px;background:#D8D8DE;overflow:hidden"><div style="{{ progressStyle }}"></div></div>
        <button type="button" onClick="{{ showMore }}" style="margin-top:6px;height:48px;padding:0 28px;border-radius:24px;border:1.5px solid #0050A0;background:#fff;color:#0050A0;font-family:Inter,sans-serif;font-size:15px;font-weight:700;cursor:pointer" style-hover="background:#EBF3FE">Prikaži još promocija</button>
      </div>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="background:#F1F1F4;font-family:Inter,sans-serif;color:#101117;padding-bottom:40px">
  <dc-import name="Components/InfoPageHead" variant="mobile" heading="Akcije i promocije" intro="Sve aktualne akcije, popusti i promo kodovi na jednom mjestu." on-home="{{ onHome }}" hint-size="100%,130px"></dc-import>
  <div class="nsb" ref="{{ catRefMob }}" onScroll="{{ onCatScroll }}" style="display:flex;gap:4px;overflow-x:auto;padding:18px 12px 4px">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="9">
      <a href="#" onClick="{{ c.onClick }}" style="width:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#101117">
        <span style="{{ c.ringStyleMob }}">
          <sc-if value="{{ c.isAll }}" hint-placeholder-val="{{ false }}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#DA0D00"><path d="M12.9 2.2c.3-.3.8-.2 1 .2 1 2 3.1 3.5 4.5 5.4A8.3 8.3 0 0 1 20 12.8C20 17.3 16.4 21 12 21s-8-3.7-8-8.2c0-2.3.9-4.3 2.4-5.8.3-.3.9-.2 1 .3.3 1.2 1 2.2 2 2.8-.1-3.2 1.3-5.6 3.5-6.9zM12 19c1.9 0 3.4-1.4 3.4-3.2 0-1.6-1-2.6-2.1-3.5-.5.9-1.3 1.6-2.3 1.9-.5.1-1-.2-1-.7v-.3c-.9.7-1.4 1.6-1.4 2.6C8.6 17.6 10.1 19 12 19z"></path></svg>
          </sc-if>
          <sc-if value="{{ c.hasImg }}" hint-placeholder-val="{{ true }}">
            <span style="{{ c.imgStyle }}"></span>
          </sc-if>
        </span>
        <span style="{{ c.labelStyleMob }}">{{ c.label }}</span>
      </a>
    </sc-for>
  </div>
  <div style="margin:10px 16px 0 12px;height:4px;border-radius:2px;background:#D8D8DE;position:relative;overflow:hidden"><div style="{{ catProgStyle }}"></div></div>

  <sc-if value="{{ showFeatured }}" hint-placeholder-val="{{ true }}">
    <h2 style="font-size:17px;font-weight:600;letter-spacing:-0.02em;margin:28px 12px 12px">Odabrane akcije i promocije</h2>
    <div class="nsb" onScroll="{{ onFeatScroll }}" style="display:flex;gap:12px;overflow-x:auto;padding:0 12px">
      <sc-for list="{{ featured }}" as="pr" hint-placeholder-count="3">
        <div style="width:290px;flex-shrink:0;display:flex;flex-direction:column">
          <dc-import name="Components/PromoCard" variant="mobile" fixed-lines="{{ true }}" promo="{{ pr }}" on-open="{{ openPromo }}" hint-size="100%,340px"></dc-import>
        </div>
      </sc-for>
    </div>
    <div style="margin:10px 16px 0 12px;height:4px;border-radius:2px;background:#D8D8DE;position:relative;overflow:hidden"><div style="{{ featProgStyle }}"></div></div>
  </sc-if>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:32px 12px 12px">
    <h2 style="font-size:17px;font-weight:600;letter-spacing:-0.02em;margin:0">{{ listTitle }}</h2>
    <span style="font-size:12px;color:#545F71;white-space:nowrap">{{ countLabel }}</span>
  </div>
  <div style="display:flex;gap:4px;padding:3px;margin:0 12px 14px;background:#fff;border-radius:10px">
    <sc-for list="{{ sorts }}" as="so" hint-placeholder-count="2">
      <button type="button" onClick="{{ so.onClick }}" style="{{ so.styleMob }}">{{ so.label }}</button>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;padding:0 12px">
    <sc-for list="{{ shown }}" as="pr" hint-placeholder-count="4">
      <dc-import name="Components/PromoCard" variant="mobile" promo="{{ pr }}" on-open="{{ openPromo }}" hint-size="100%,380px"></dc-import>
    </sc-for>
  </div>

  <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin:24px 12px 0">
      <span style="font-size:12px;color:#545F71">{{ progressLabel }}</span>
      <div style="width:180px;height:4px;border-radius:2px;background:#D8D8DE;overflow:hidden"><div style="{{ progressStyle }}"></div></div>
      <button type="button" onClick="{{ showMore }}" style="margin-top:4px;width:100%;height:48px;border-radius:24px;border:1.5px solid #0050A0;background:#fff;color:#0050A0;font-family:Inter,sans-serif;font-size:15px;font-weight:700;cursor:pointer">Prikaži još promocija</button>
    </div>
  </sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onHome&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onOpenPromo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p: any) =&gt; void&quot;}}">
const P_CATS = [
  { id: 'all', label: 'Sve akcije i popusti' },
  { id: 'bijela', label: 'Bijela tehnika', img: 'images/cat-hladnjaci.webp' },
  { id: 'tv', label: 'TV i audio', img: 'images/cat-televizori.webp' },
  { id: 'it', label: 'Računala i IT oprema', img: 'images/cat-laptopi.webp' },
  { id: 'mobiteli', label: 'Mobilni uređaji i foto', img: 'images/cat-mobiteli.webp' },
  { id: 'mali', label: 'Mali kućanski aparati', img: 'images/cat-mali-aparati.webp' },
  { id: 'njega', label: 'Osobna njega', img: 'images/cat-osobna-njega.webp' },
  { id: 'gaming', label: 'Gaming', img: 'images/cat-gaming.webp' },
  { id: 'klima', label: 'Klimatizacija i grijanje', img: 'images/cat-klima.webp' },
  { id: 'audio', label: 'Audio i zvučnici', img: 'images/cat-audio.webp' },
  { id: 'satovi', label: 'Pametni satovi', img: 'images/cat-pametni-satovi.webp' },
  { id: 'kamere', label: 'Kamere i dronovi', img: 'images/cat-kamere.webp' },
  { id: 'pc', label: 'Stolna računala', img: 'images/cat-stolna-racunala.webp' },
  { id: 'pranje', label: 'Pranje i sušenje', img: 'images/cat-perilice.webp' },
  { id: 'ugradbeni', label: 'Ugradbeni aparati', img: 'images/cat-pecnice.webp' },
  { id: 'posudje', label: 'Perilice posuđa', img: 'images/cat-pranje-posuda.webp' }
];
const P_LIST = [
  { id: 'skola', feat: true, img: 'images/hero-m-5.jpg', cat: 'it', title: 'Završno zvono za velike popuste', text: 'Zadnji dani školske akcije — laptopi, tableti, satovi i romobili do 40% jeftinije uz promo kod. Ponuda vrijedi do isteka zaliha.', end: '2026-09-30' },
  { id: 'epic', feat: true, img: 'images/hero-m-1.jpg', cat: 'tv', title: 'Stigle su vruće epic deals ponude uz besplatnu dostavu', text: 'Uštedi do 50% na više od 1000 artikala uz plaćanje do 24 rate i besplatnu dostavu na kućnu adresu.', end: '2026-10-05' },
  { id: 'zlato', feat: true, img: 'images/hero-m-3.jpg', cat: 'tv', title: 'Kreće lov na zlato, a ti po novi televizor', text: 'Navijaj u najboljoj slici — odabrani televizori i soundbarovi vodećih brendova do 35% jeftiniji.', end: '2026-10-12' },
  { id: 'visa', img: 'images/hero-m-2.jpg', cat: 'bijela', title: 'Tjedan Premium Visa ušteda', text: 'Plati Premium Visa karticom i ostvari do 50% dodatnog popusta te do 36 rata bez kamata na odabrane uređaje.', end: '2026-10-04' },
  { id: 'asus', img: 'images/hero-m-4.jpg', cat: 'it', title: 'Asus tjedan za ljetni tech boost', text: 'Gaming i poslovni laptopi Asus uz dodatnih 10% popusta i poklon miš uz svaku kupnju.', end: '2026-10-08' },
  { id: 'ljeto', img: 'images/hero-m-6.jpg', cat: 'audio', title: 'Uđi u jesen uz UAU uređaje', text: 'Zadnji dani ljetne akcije — zvučnici, ventilatori i mali kućanski aparati do 35% jeftiniji.', end: '2026-10-01' },
  { id: 'pc', img: 'images/hero-m-7.jpg', cat: 'pc', title: 'Stolno računalo spremno za sve zadatke', text: 'Složi svoj setup — gaming i uredska računala s popustom na monitore, tipkovnice i periferiju.', end: '2026-10-20' },
  { id: 'ugradbeni', img: 'images/promo-hisense.png', cat: 'ugradbeni', title: '5 godina garancije na ugradbene aparate', text: 'Uz kupnju ugradbene pećnice, ploče ili napa dobivaš produljenu garanciju na ukupno pet godina bez doplate.', end: '2026-10-31' },
  { id: 'hisense', img: 'images/promo-philips-tv.png', cat: 'bijela', title: 'Hisense: 2+3 godine garancije i do 30% popusta', text: 'Registriraj novi Hisense uređaj u 30 dana od kupnje i produži garanciju na pet godina.', end: '2026-11-15' },
  { id: 'gaming-tj', img: 'images/hero-m-7.jpg', cat: 'gaming', title: 'Gaming tjedan: konzole, igre i dodaci', text: 'Do 25% popusta na gaming periferiju, slušalice i odabrane igre uz dostavu isti dan u Zagrebu.', end: '2026-10-03' },
  { id: 'satovi', img: 'images/hero-m-4.jpg', cat: 'satovi', title: 'Pametni satovi uz poklon remen', text: 'Uz kupnju odabranih pametnih satova dobivaš dodatni remen i 12 rata bez kamata.', end: '2026-10-18' },
  { id: 'dronovi', img: 'images/hero-m-2.jpg', cat: 'kamere', title: 'Dronovi i akcijske kamere do -30%', text: 'Snimaj iz zraka po sniženim cijenama — dronovi, gimbali i akcijske kamere vodećih brendova.', end: '2026-10-22' },
  { id: 'mobiteli', img: 'images/hero-m-3.jpg', cat: 'mobiteli', title: 'Zamijeni stari mobitel i uštedi', text: 'Donesi stari uređaj u trgovinu i ostvari do 200 € dodatnog popusta na novi pametni telefon.', end: '2026-10-30' },
  { id: 'perilice', img: 'images/promo-philips-tv.png', cat: 'pranje', title: 'Perilice i sušilice uz besplatnu montažu', text: 'Kupi perilicu ili sušilicu rublja i ostvari besplatnu dostavu, montažu i odvoz starog uređaja.', end: '2026-10-14' },
  { id: 'posudje', img: 'images/promo-hisense.png', cat: 'posudje', title: 'Ugradbene perilice posuđa do -20%', text: 'Tihe i štedljive perilice posuđa po akcijskim cijenama uz produljeno jamstvo.', end: '2026-10-25' },
  { id: 'njega', img: 'images/hero-m-6.jpg', cat: 'njega', title: 'Osobna njega: sušila i aparati za brijanje', text: 'Odabrani aparati za njegu kose i lica do 30% jeftiniji uz promo kod.', end: '2026-10-02' },
  { id: 'klima', img: 'images/hero-m-1.jpg', cat: 'klima', title: 'Pripremi dom za zimu: grijalice i klime', text: 'Inverter klime i grijalice uz besplatnu montažu u odabranim gradovima i 24 rate.', end: '2026-11-05' },
  { id: 'philips', img: 'images/promo-smeg.png', cat: 'tv', title: 'Do 20% popusta na Philips Ambilight televizore', text: 'Ambilight modeli po sniženim cijenama uz besplatnu dostavu i montažu na zid u odabranim gradovima.', end: '2026-10-26' }
];
const TODAY = new Date('2026-09-29T00:00:00');
const MONTHS = ['sij', 'velj', 'ožu', 'tra', 'svi', 'lip', 'srp', 'kol', 'ruj', 'lis', 'stu', 'pro'];

class Component extends DCLogic {
  state = { cat: 'all', sort: 'new', limit: 6, cp: 0, cs: 0, ce: 1 };
  catRef = (el) => { this.catEl = el; };
  catRefMob = (el) => { if (el) this.catEl = el; };
  onCatScroll = (e) => this.measureCat(e.currentTarget);
  onFeatScroll = (e) => { const el = e.currentTarget, max = el.scrollWidth - el.clientWidth; const fp = max > 0 ? el.scrollLeft / max : 0; if (Math.abs(fp - (this.state.fp || 0)) > 0.005) this.setState({ fp }); };
  measureCat(el) {
    if (!el) return;
    const max = el.scrollWidth - el.clientWidth;
    const cp = max > 0 ? el.scrollLeft / max : 0;
    const cs = el.scrollLeft > 4 ? 1 : 0, ce = el.scrollLeft < max - 4 ? 1 : 0;
    if (Math.abs(cp - this.state.cp) > 0.005 || cs !== this.state.cs || ce !== this.state.ce) this.setState({ cp, cs, ce });
  }
  componentDidMount() { setTimeout(() => this.measureCat(this.catEl), 300); }
  catStep = (d) => { const el = this.catEl; if (el) el.scrollBy({ left: d * Math.max(300, el.clientWidth * 0.6), behavior: 'smooth' }); };


  renderVals() {
    const p = this.props, s = this.state;
    const mobile = p.variant === 'mobile';
    const CATS = P_CATS;
    const ALL = P_LIST;
    const catLabel = (id) => (CATS.find(c => c.id === id) || {}).label || '';
    const home = (e) => { if (e) e.preventDefault(); if (p.onHome) p.onHome(); };

    const deco = (pr) => {
      const end = new Date(pr.end + 'T00:00:00');
      const days = Math.round((end - TODAY) / 86400000);
      const urgency = days <= 0 ? 'Ističe danas' : days === 1 ? 'Još 1 dan' : days <= 3 ? 'Još ' + days + ' dana' : '';
      return Object.assign({}, pr, {
        cat: catLabel(pr.cat), catId: pr.cat, days, urgency,
        date: 'Do ' + end.getDate() + '. ' + MONTHS[end.getMonth()] + '. ' + end.getFullYear() + '.'
      });
    };
    const all = ALL.map(deco);
    const featured = all.filter(x => x.feat);
    let list = s.cat === 'all' ? all.filter(x => !x.feat) : all.filter(x => x.catId === s.cat);
    list = list.slice().sort((a, b) => s.sort === 'end' ? a.days - b.days : b.days - a.days);
    const total = list.length;
    const shown = list.slice(0, s.limit);
    const activeCount = s.cat === 'all' ? all.length : total;
    const plural = (n) => n % 10 === 1 && n % 100 !== 11 ? 'aktivna promocija' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'aktivne promocije' : 'aktivnih promocija';

    const cats = CATS.filter(c => c.id === 'all' || all.some(x => x.catId === c.id)).map(c => {
      const on = s.cat === c.id;
      const ring = (size) => ({
        width: size, height: size, borderRadius: '50%', background: '#fff', boxSizing: 'border-box',
        display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0,
        border: on ? '2px solid #002D73' : '2px solid transparent',
        boxShadow: on ? '0 0 0 3px #fff inset' : 'none', transition: 'border-color .15s'
      });
      const lbl = (fs) => ({ fontSize: fs, lineHeight: 1.3, textAlign: 'center', fontWeight: on ? 700 : 500, color: on ? '#002D73' : '#3C4450', textWrap: 'balance' });
      return {
        label: c.label, isAll: c.id === 'all', hasImg: !!c.img,
        onClick: (e) => { if (e) e.preventDefault(); this.setState({ cat: c.id, limit: 6 }); },
        ringStyle: ring(88), ringStyleMob: ring(68),
        labelStyle: lbl(13), labelStyleMob: lbl(11.5),
        imgStyle: { width: '72%', height: '72%', backgroundImage: 'url("' + c.img + '")', backgroundSize: 'contain', backgroundRepeat: 'no-repeat', backgroundPosition: 'center', mixBlendMode: 'multiply', display: 'block' }
      };
    });

    const arrowSt = (side, on) => ({
      position: 'absolute', [side]: 0, top: 48, transform: 'translateY(-50%)', width: 40, height: 40, borderRadius: '50%',
      background: 'rgba(255,255,255,0.9)', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center',
      zIndex: 2, boxShadow: '0 2px 8px rgba(0,0,0,0.2)', color: '#101117', cursor: 'pointer',
      pointerEvents: on ? 'auto' : 'none', opacity: on ? 1 : 0, transition: 'opacity .2s'
    });
    const segBtn = (on, mob) => ({
      height: mob ? 34 : 34, padding: mob ? '0 10px' : '0 14px', flex: mob ? 1 : 'none', borderRadius: 8, border: 'none', cursor: 'pointer',
      fontFamily: 'Inter,sans-serif', fontSize: 13, fontWeight: on ? 700 : 500,
      background: on ? '#002D73' : 'transparent', color: on ? '#fff' : '#3C4450', transition: 'background .15s, color .15s'
    });
    const sorts = [['new', 'Najnovije'], ['end', 'Uskoro ističu']].map(o => ({
      label: o[1], onClick: () => this.setState({ sort: o[0] }),
      style: segBtn(s.sort === o[0], false), styleMob: segBtn(s.sort === o[0], true)
    }));

    return {
      isDesktop: !mobile, isMobile: mobile,
      onHome: () => { if (p.onHome) p.onHome(); },
      onFeatScroll: this.onFeatScroll,
      featProgStyle: { position: 'absolute', top: 0, left: 0, height: '100%', borderRadius: 2, background: '#0050A0', width: (34 + (s.fp || 0) * 66) + '%', transition: 'width .15s' },
      catRef: this.catRef, catRefMob: this.catRefMob, onCatScroll: this.onCatScroll,
      catPrev: () => this.catStep(-1), catNext: () => this.catStep(1),
      catProgStyle: { position: 'absolute', top: 0, left: 0, height: '100%', borderRadius: 2, background: '#0050A0', width: ((mobile ? 28 : 40) + s.cp * (mobile ? 72 : 60)) + '%', transition: 'width .15s' },
      prevStyle: arrowSt('left', s.cs),
      nextStyle: arrowSt('right', s.ce),
      cats, sorts,
      showFeatured: s.cat === 'all' && featured.length >= 3,
      featured, feat0: featured[0], feat1: featured[1], feat2: featured[2],
      listTitle: s.cat === 'all' ? 'Sve akcije i promocije' : catLabel(s.cat),
      countLabel: activeCount + ' ' + plural(activeCount),
      shown,
      hasMore: total > shown.length,
      progressLabel: 'Prikazano ' + shown.length + ' od ' + total,
      progressStyle: { width: (total ? shown.length / total * 100 : 0) + '%', height: '100%', background: '#0050A0', borderRadius: 2 },
      showMore: () => this.setState(st => ({ limit: st.limit + 6 })),
      openPromo: (pr) => { if (p.onOpenPromo) p.onOpenPromo(pr); }
    };
  }
}
</script>
</body>
</html>
